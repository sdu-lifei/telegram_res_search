server {
    listen 80;
    listen [::]:80;
    server_name panss.dpdns.org;

    # Keep the ACME challenge reachable before the TLS vhost is installed.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
